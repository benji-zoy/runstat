# Projet Container Manager (Synology) : dossier /docker/runstat sur le NAS. Container Manager garde sa propre copie de ce
# fichier : tout changement est à recopier dans Projet › runstat › YAML, puis Arrêter › Nettoyer › Construire.
# Valeurs réelles (adresse locale du NAS, hôte ts.net) seulement dans cette copie : le dépôt est public.
# Le site (build Angular) est copié dans ./html par `npm run deploy` ; les données de chaque compte sont dans ./users
# (users.json, puis users/<id>/data-raw, snapshot, secrets ; scripts/migrate-users.sh pour une instance mono-utilisateur).
services:
  runstat:
    image: nginx:alpine
    container_name: runstat
    ports:
      # Réseau local seulement (adresse locale du NAS, pas 0.0.0.0) : ce port sert le compte du propriétaire, il ne doit
      # pas être joignable par l'adresse Tailscale du NAS (100.x), que voient les proches avec qui le nœud est partagé.
      - "192.168.1.10:8080:80"
      # Tailscale Serve : tailscale serve --bg --https=443 http://127.0.0.1:8090
      - "127.0.0.1:8090:81"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx:/etc/nginx/conf.d:ro
    networks: [runstat]
    restart: unless-stopped

  # Synchro des comptes hébergés au démarrage puis toutes les SYNC_INTERVAL_MIN minutes (un run à la fois), à la demande
  # par le site, et API du site (/api/…, proxy nginx ; ports 8787 lan et 8788 tailnet non publiés). scripts/sync/server.mjs.
  # Chaque run relit les scripts : un `npm run deploy` suffit, sauf changement de server.mjs ou app.mjs (redémarrer).
  runstat-sync:
    image: node:24-alpine
    container_name: runstat-sync
    user: "1026:100" # uid:gid du propriétaire des fichiers de /docker/runstat sur le NAS (id <utilisateur>)
    working_dir: /app
    environment:
      TZ: Europe/Paris
      RUNSTAT_USERS: /app/users
      SYNC_INTERVAL_MIN: "180"
      # Place par compte hébergé (Mo)
      RUNSTAT_USER_QUOTA_MB: "2048"
      # Adresses du site acceptées pour la connexion Strava (redirect_uri) ; Strava n'accepte que le domaine de rappel
      # de l'appli de chacun (l'hôte ts.net), l'adresse locale sert si ce domaine est l'IP du NAS.
      SYNC_PUBLIC_ORIGINS: "https://nas.tailXXXX.ts.net,http://192.168.1.10:8080"
    volumes:
      - ./app/scripts:/app/scripts:ro
      - ./app/node_modules:/app/node_modules:ro
      - ./app/package.json:/app/package.json:ro
      - ./users:/app/users
    command: ["node", "scripts/sync/server.mjs"]
    networks: [runstat]
    restart: unless-stopped

# Sous-réseau fixe : la passerelle (172.28.0.1) est la seule source admise sur le port tailnet de nginx (default.conf)
networks:
  runstat:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
