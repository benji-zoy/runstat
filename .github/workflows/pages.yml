# Appli publique (local-first, sans données) sur GitHub Pages : tests, construction `pages`, CSP, publication.
# Le chiffrement de bout en bout ne vaut que ce que vaut ce build : actions épinglées par SHA, npm ci, droits minimaux,
# publication depuis main seulement (branche protégée).
# Variables du dépôt : RUNSTAT_NAS_ORIGINS (adresses publiques Funnel des NAS connus, séparées par des virgules) ;
# RUNSTAT_PAGES = true une fois Settings › Pages réglé sur « GitHub Actions » (sans elle : tests et construction seulement).
name: Appli publique

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:sync
      - run: npx ng test --watch=false
      - run: npm run check:engine
      - name: Construction
        env:
          RUNSTAT_NAS_ORIGINS: ${{ vars.RUNSTAT_NAS_ORIGINS }}
        run: |
          json=$(node -e 'console.log(JSON.stringify(JSON.stringify((process.env.RUNSTAT_NAS_ORIGINS||"").split(",").map(s=>s.trim()).filter(Boolean).map(s=>new URL(s).origin))))')
          npx ng build -c pages --define "RUNSTAT_NAS_ORIGINS=$json"
          node scripts/pages-postbuild.mjs dist/runstat-pages/browser
      - if: vars.RUNSTAT_PAGES == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: vars.RUNSTAT_PAGES == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/runstat-pages/browser

  deploy:
    if: vars.RUNSTAT_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
