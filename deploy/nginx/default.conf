# Site RunStat (conteneur runstat, nginx) : un bloc server par zone de confiance, chacun relayé vers SON port de
# runstat-sync (scripts/sync/server.mjs). L'identité vient du port, jamais d'un en-tête envoyé par le client :
#   :80 → runstat-sync:8787 (zone lan)     réseau local, port 8080 du NAS lié à son adresse locale : compte du propriétaire
#   :81 → runstat-sync:8788 (zone tailnet) Tailscale Serve (HTTPS 443 → 127.0.0.1:8090) : Tailscale-User-Login transmis
#   :82 → runstat-sync:8789 (zone public)  Tailscale Funnel (HTTPS 8443 → 127.0.0.1:8091) : /auth/, /backup/, /relay/ seulement
# Fichiers communs : site.inc (site et relais), proxy.inc (en-têtes relayés), security.inc (en-têtes de sécurité du site).
# docker-compose.yml monte ce dossier sur conf.d : nginx y charge chaque *.conf au niveau http, d'où les inclusions en .inc.

# Origine du site vue par le navigateur, transmise à runstat-sync (redirect_uri de la connexion Strava) :
# celle de Tailscale Serve (X-Forwarded-Host / -Proto) si présente, sinon l'hôte et le schéma de la requête (réseau local).
map $http_x_forwarded_host $public_host {
  default $http_x_forwarded_host;
  "" $http_host;
}
map $http_x_forwarded_proto $public_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}
# Adresse du client sur Internet (zone public) : la valeur la plus à droite de X-Forwarded-For, celle ajoutée par Funnel
# (un client peut forger les précédentes). Pas de module realip : il changerait l'adresse avant allow/deny.
map $http_x_forwarded_for $client_ip {
  "~(?<last>[^,\s]+)\s*$" $last;
  default $remote_addr;
}

# Limites de débit de la zone public (:82 seulement), par adresse du client ($client_ip ci-dessus, jamais $remote_addr :
# toutes les requêtes Funnel arrivent de la passerelle Docker). Premier rempart avant le service Node (mono-processus), qui
# garde ses propres limites (30/min par adresse sur /auth, 1 200 requêtes / 10 min par compte sur la sauvegarde). 10 Mo par
# zone : des dizaines de milliers d'adresses suivies (les plus anciennes oubliées au-delà). Débits larges pour un usage normal.
#   auth   : 60/min, rafale de 30 (le service refuse déjà au-delà de 30/min par adresse)
#   backup : 10/s, rafale de 300 (une première sauvegarde ou une restauration enchaîne des centaines d'objets)
#   relay  : 5/s, rafale de 100 (une synchro Garmin relaie un FIT par sortie)
limit_req_zone $client_ip zone=public_auth:10m rate=60r/m;
limit_req_zone $client_ip zone=public_backup:10m rate=10r/s;
limit_req_zone $client_ip zone=public_relay:10m rate=5r/s;
limit_req_status 429;
limit_req_log_level warn;

# Réseau local : aucun en-tête d'identité ne passe. Hôte limité à une adresse IP, un nom court ou un nom local (.local, .lan,
# .home.arpa) : contre le DNS rebinding, où une page d'un domaine public ré-résolu vers le NAS lirait les données du propriétaire.
server {
  listen 80;
  if ($host !~* "^([0-9.]+|\[[0-9a-f:.]+\]|[a-z0-9-]+|[a-z0-9.-]+\.(local|lan|home\.arpa))$") { return 421; }
  set $sync_port 8787;
  set $ts_login "";
  include /etc/nginx/conf.d/site.inc;
}

# Tailscale Serve : Serve retire les en-têtes Tailscale-User-* envoyés par le client et pose les siens.
# Seuls tailscaled (via le port 127.0.0.1:8090 du NAS, donc la passerelle du réseau Docker) peut arriver ici : tout autre
# conteneur ou un contournement du port local (anciens Docker) est refusé.
server {
  listen 81;
  allow 172.28.0.1;
  deny all;
  set $sync_port 8788;
  set $ts_login $http_tailscale_user_login;
  include /etc/nginx/conf.d/site.inc;
}

# Tailscale Funnel : Internet. Seules l'authentification, la sauvegarde chiffrée et le relais passent ; ni le site, ni /api/,
# ni /data/. Tailles refusées ici, avant toute authentification. Même garde d'accès que le port tailnet.
server {
  listen 82;
  allow 172.28.0.1;
  deny all;
  set $sync_port 8789;
  set $ts_login "";
  client_max_body_size 64k;

  location /auth/ {
    limit_req zone=public_auth burst=30 nodelay;
    resolver 127.0.0.11 valid=30s;
    proxy_pass http://runstat-sync:$sync_port;
    include /etc/nginx/conf.d/proxy.inc;
    proxy_set_header X-Real-IP $client_ip;
    proxy_read_timeout 20s;
  }
  location /relay/ {
    limit_req zone=public_relay burst=100 nodelay;
    resolver 127.0.0.11 valid=30s;
    proxy_pass http://runstat-sync:$sync_port;
    include /etc/nginx/conf.d/proxy.inc;
    proxy_set_header X-Real-IP $client_ip;
    proxy_read_timeout 30s;
  }
  # Garmin Personal API relayée (pas de CORS chez Garmin) : fichiers d'origine (zip du FIT) de quelques Mio, sans tampon
  location /relay/garmin/ {
    limit_req zone=public_relay burst=100 nodelay;
    resolver 127.0.0.11 valid=30s;
    proxy_pass http://runstat-sync:$sync_port;
    include /etc/nginx/conf.d/proxy.inc;
    proxy_set_header X-Real-IP $client_ip;
    proxy_buffering off;
    proxy_read_timeout 90s;
  }
  # Objets chiffrés (32 Mio au plus) et manifestes (12 Mio au plus) : en flux, sans tampon nginx
  location /backup/ {
    limit_req zone=public_backup burst=300 nodelay;
    resolver 127.0.0.11 valid=30s;
    proxy_pass http://runstat-sync:$sync_port;
    include /etc/nginx/conf.d/proxy.inc;
    proxy_set_header X-Real-IP $client_ip;
    client_max_body_size 33m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }
  location / {
    return 404;
  }
}
