# Origine du site vue par le navigateur, transmise à runstat-sync (redirect_uri de la connexion Strava) :
# celle de Tailscale Serve (X-Forwarded-Host / -Proto) si présente, sinon l'hôte et le schéma de la requête (réseau local).
map $http_x_forwarded_host $public_host {
  default $http_x_forwarded_host;
  "" $http_host;
}
map $http_x_forwarded_proto $public_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;

  # Appli installable : le service worker et son manifeste ne sont pas hachés, toujours revalidés
  # (sinon la règle de cache long ci-dessous figerait l'appli un an). Les locations exactes passent avant les regex.
  location = /ngsw-worker.js {
    add_header Cache-Control "no-cache";
  }
  location = /safety-worker.js {
    add_header Cache-Control "no-cache";
  }
  location = /ngsw.json {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Icônes (noms fixes) : une semaine.
  location ^~ /icons/ {
    expires 7d;
  }
  location = /favicon.svg {
    expires 7d;
  }

  # Fichiers à nom haché par le build : cache long.
  location ~* \.(js|css|woff2?|png|svg)$ {
    expires 1y;
  }

  # Données et page d'entrée : toujours revalidées après un déploiement.
  location /data/ {
    add_header Cache-Control "no-cache";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Synchro à la demande (bouton de l'en-tête) : service runstat-sync du projet, jamais publié lui-même.
  # Résolu à chaque requête (DNS Docker) pour que nginx démarre même si runstat-sync est arrêté.
  location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $sync http://runstat-sync:8787;
    proxy_pass $sync;
    proxy_set_header X-Forwarded-Host $public_host;
    proxy_set_header X-Forwarded-Proto $public_proto;
    proxy_read_timeout 15s;
  }

  # Archive Strava envoyée depuis Réglages (souvent plusieurs centaines de Mo) : transmise en flux à runstat-sync,
  # qui l'écrit sur le disque (sans tampon nginx, délais longs).
  location = /api/strava/archive {
    resolver 127.0.0.11 valid=30s;
    set $sync http://runstat-sync:8787;
    proxy_pass $sync;
    client_max_body_size 2g;
    proxy_request_buffering off;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }

  # Routes Angular (/forme?section=…) : renvoyer index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
